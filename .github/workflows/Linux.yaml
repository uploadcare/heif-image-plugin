name: Linux

on: [push]

jobs:
  build:
    name: Build wheel / ${{ matrix.base }} / ${{ matrix.platform.arch }}
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 3
    strategy:
      fail-fast: false
      matrix:
        base: [manylinux, musllinux]
        platform:
          - { arch: x86_64, runner: ubuntu-24.04 }
          - { arch: aarch64, runner: ubuntu-24.04-arm }
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build and check wheel
        uses: docker/build-push-action@v7
        env:
          DOCKER_BUILD_SUMMARY: false
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          context: .
          file: .github/wheels.Dockerfile
          target: wheel
          build-args: BASE=${{ matrix.base }}
          outputs: type=local,dest=wheels

      - uses: actions/upload-artifact@v7
        with:
          archive: false
          path: wheels/*.whl
          if-no-files-found: error

  test-glibc:
    name: Test wheel / glibc / ${{ matrix.platform.arch }} / ${{ matrix.runtime.stack }} ${{ matrix.runtime.libheif }} / Pillow ${{ matrix.runtime.pillow || 'latest' }}
    needs: build
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        platform:
          - { arch: x86_64, runner: ubuntu-24.04 }
          - { arch: aarch64, runner: ubuntu-24.04-arm }
        runtime:
          - { stack: system }
          - { stack: bundled, libheif: '1.17.*' }
          - { stack: bundled, libheif: '1.18.*' }
          - { stack: bundled, libheif: '1.19.*' }
          - { stack: bundled, libheif: '1.20.*' }
          - { stack: bundled, libheif: '1.21.*' }
          - { stack: bundled, libheif: '1.22.*' }
          - { stack: bundled, libheif: '1.23.*' }
          - { stack: ucare, libheif: '1.23.6-f81f28a-8543bdc' }
          - { stack: ucare, libheif: '1.23.6-f81f28a-8543bdc', pillow: prod }
        exclude:
          - platform: { arch: aarch64 }
            runtime: { pillow: prod }

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - uses: actions/download-artifact@v8
        with:
          pattern: '*-manylinux_2_28_${{ matrix.platform.arch }}.whl'
          path: wheels
          merge-multiple: true
          skip-decompress: true

      - if: matrix.runtime.stack == 'system'
        name: Install system libheif
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libheif1 \
            libheif-plugin-libde265 libheif-plugin-x265 libheif-plugin-aomenc

      - if: matrix.runtime.stack == 'bundled'
        name: Install bundled libheif
        run: |
          pip install "libheif-binary==${{ matrix.runtime.libheif }}"

      - if: matrix.runtime.stack == 'ucare'
        name: Install Uploadcare libheif
        run: |
          BUCKET=https://uploadcare-packages.s3.amazonaws.com
          curl -fLO "$BUCKET/libheif/libheif-uc_${{ matrix.runtime.libheif }}_$(dpkg --print-architecture).deb"
          sudo apt-get update
          sudo apt-get remove -y libheif1
          sudo apt-get install --no-install-recommends -y ./*.deb
          rm *.deb

      - if: matrix.runtime.pillow == 'prod'
        name: Install Pillow-SIMD build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            build-essential libffi-dev libjpeg-dev libpng-dev libtiff-dev liblcms2-dev

      - name: Install plugin and test dependencies
        env:
          PIP_ARGS: >-
            ${{ matrix.runtime.pillow == 'prod'
                && '--group dev-pillow-prod'
                || '--group dev-pillow-latest --only-binary=pillow' }}
        run: |
          pip install --upgrade 'pip>=25.1'
          pip install $PIP_ARGS wheels/*.whl
          rm -rf HeifImagePlugin.py _heif_image_plugin

      - name: Check bundled libheif version
        if: matrix.runtime.stack == 'bundled'
        run: |
          python - <<'PY'
          import libheif_binary
          from HeifImagePlugin import libheif_version
          assert libheif_version == libheif_binary.get_version(), (libheif_version, expected)
          PY

      - name: Test
        run: make test

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          verbose: true


  test-musl:
    name: Test wheel / musl / ${{ matrix.platform.arch }} / bundled
    needs: build
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        platform:
          - { arch: x86_64, runner: ubuntu-24.04 }
          - { arch: aarch64, runner: ubuntu-24.04-arm }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: '*-musllinux_1_2_${{ matrix.platform.arch }}.whl'
          path: wheels
          merge-multiple: true
          skip-decompress: true
      - name: Install and test wheel
        run: |
          docker run --rm -v ".:/src" -w /src mirror.gcr.io/library/python:3.12-alpine sh -ec '
            apk add --no-cache make
            pip install --upgrade "pip>=25.1"
            pip install --only-binary=:all: --group dev-pillow-latest wheels/*.whl libheif-binary
            rm -rf HeifImagePlugin.py _heif_image_plugin
            make test
          '
      - uses: codecov/codecov-action@v7
        with:
          files: coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          verbose: true
