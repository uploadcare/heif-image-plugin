[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "heif-image-plugin"
version = "0.7.0"
description = "Simple HEIF/HEIC images plugin for Pillow base on pyhief library."
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Alexander Karpinsky", email = "homm86@gmail.com" },
]
keywords = ["heif", "heic", "Pillow", "plugin", "pyhief"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Natural Language :: English",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.7",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: Implementation :: PyPy",
    "Topic :: Multimedia :: Graphics",
]
dependencies = [
    "pyheif>=0.8.0",
    "piexif>=1.1.3",
]

[project.urls]
Homepage = "https://github.com/uploadcare/heif-image-plugin"

[dependency-groups]
test = [
    "pillow>=9.0.0,<12",
    "pytest>=8.3.2",
    "pytest-cov>=5.0.0",
]
dev = [
    "isort>=9.0.1",
    "flake8>=7.3.0",
]

[tool.setuptools]
py-modules = ["HeifImagePlugin"]
