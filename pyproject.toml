[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "heif-image-plugin"
version = "0.8.0"
description = "A HEIF/HEIC and AVIF plugin for Pillow based on the pyheif library."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Alexander Karpinsky", email = "homm86@gmail.com" },
]
keywords = ["heif", "heic", "Pillow", "plugin", "pyheif"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Natural Language :: English",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Graphics",
]
dependencies = [
    "pyheif>=0.8.0",
    "piexif>=1.1.3",
]

[project.urls]
Homepage = "https://github.com/uploadcare/heif-image-plugin"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=7.0.0",
    "isort>=6.0.0",
    "flake8>=7.0.0",
]
dev-pillow-latest = [
    { include-group = "dev" },
    "pillow>=9.5.0",
]
dev-pillow-prod = [
    { include-group = "dev" },
    "pillow @ file:./pip-stubs/pillow",
    "pillow-simd @ git+https://github.com/uploadcare/pillow-simd.git@simd/9.5-lut-overflow",
]

[tool.setuptools]
py-modules = ["HeifImagePlugin"]
